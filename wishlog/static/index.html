<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>抽卡查询</title>
<style>
  /* 字体：思源黑体（正文）、思源宋体（大数字，只含数字和英文）、霞鹜文楷（角色名和标题）。都是 OFL 开源字体，
     文件在 fonts/ 里；缺的极个别生僻字会自动退回系统字体。粗细只用文件里有的几档，免得浏览器硬加粗显得糊。 */
  @font-face { font-family: "Noto Sans SC"; font-weight: 400; font-style: normal; font-display: block; src: url("fonts/NotoSansSC-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Noto Sans SC"; font-weight: 500; font-style: normal; font-display: block; src: url("fonts/NotoSansSC-Medium.woff2") format("woff2"); }
  @font-face { font-family: "Noto Serif SC"; font-weight: 600; font-style: normal; font-display: block; src: url("fonts/NotoSerifSC-SemiBold.woff2") format("woff2"); }
  @font-face { font-family: "LXGW WenKai"; font-weight: 700; font-style: normal; font-display: block; src: url("fonts/LXGWWenKai-Bold.woff2") format("woff2"); }
  :root {
    --font-ui: "Noto Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    --font-num: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
    --font-name: "LXGW WenKai", "Kaiti SC", "KaiTi", "STKaiti", var(--font-ui);
    color-scheme: light dark;   /* 滚动条、下拉框这些系统控件也跟着变 */
    --bg: #f6f5f1; --card: #ffffff; --side: #ece9e0; --ink: #23221f; --muted: #6f6c64; --line: #e4e1d8;
    --accent: #3b5bdb; --accent-ink: #ffffff;
    --top: #b7791f; --top-bg: #fbf0d9; --second: #7048c7; --second-bg: #efe8fb; --other: #5d6b7a;
    --good: #2f855a; --warn: #b7791f; --bad: #c53030; --track: #ece9e0;
    --ok-bg: #e6f4ea; --err-bg: #fdeaea; --info-bg: #e8eefc; --warn-bg: #fdf3dc;
    --pill: #ffffff;
  }
  /* 外观：默认跟随系统；用户在侧栏点「外观」手动选了浅色/深色时，html 上会有 data-theme。
     下面两处深色变量必须一模一样（有测试检查）。 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171a; --card: #202024; --side: #1d1d21; --ink: #ecebe6; --muted: #9b988f; --line: #33333a;
      --accent: #748ffc; --accent-ink: #11131a;
      --top: #f2c14e; --top-bg: #3a3119; --second: #b79cf5; --second-bg: #2d2640; --other: #8d9aa8;
      --good: #68d391; --warn: #f2c14e; --bad: #fc8181; --track: #34343b;
      --ok-bg: #1b3326; --err-bg: #3b2020; --info-bg: #202a45; --warn-bg: #3a3119;
      --pill: #3c3c44;
    }
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #17171a; --card: #202024; --side: #1d1d21; --ink: #ecebe6; --muted: #9b988f; --line: #33333a;
    --accent: #748ffc; --accent-ink: #11131a;
    --top: #f2c14e; --top-bg: #3a3119; --second: #b79cf5; --second-bg: #2d2640; --other: #8d9aa8;
    --good: #68d391; --warn: #f2c14e; --bad: #fc8181; --track: #34343b;
    --ok-bg: #1b3326; --err-bg: #3b2020; --info-bg: #202a45; --warn-bg: #3a3119;
    --pill: #3c3c44;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* 自己写的 display 样式不能把 hidden 的元素又显示出来 */
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 clamp(15px, 0.45vw + 10.5px, 18px)/1.6 var(--font-ui);   /* 窗口越大字越大一点 */
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  button, select, input, textarea {
    font: inherit; font-weight: 500; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .55; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .muted { color: var(--muted); font-size: 13px; }

  /* ---- 整体布局：左侧游戏列表 + 右侧内容 ---- */
  .app { display: grid; grid-template-columns: clamp(232px, 21vw, 340px) 1fr; min-height: 100vh; }
  .side { background: var(--side); padding: 18px 12px 90px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--line);
          position: sticky; top: 0; height: 100vh; overflow-y: auto; }   /* 固定在窗口左边 */
  .brand { font: 700 19px/1.3 var(--font-name); padding: 2px 8px 14px; letter-spacing: .08em; }
  #games { position: relative; display: flex; flex-direction: column; gap: 6px; }
  .game { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; border-color: transparent; background: transparent; padding: 11px 12px; min-height: 60px; font-size: 1.07em; }
  .game img { width: clamp(38px, 1.5vw + 24px, 50px); height: clamp(38px, 1.5vw + 24px, 50px); border-radius: 22%; flex: none; display: block; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .game .gname { flex: 1; min-width: 0; font-weight: 500; opacity: .72; transition: opacity .3s; }
  .game small { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .game:hover:not(:disabled) { border-color: transparent; background: rgba(128,128,128,.12); }
  .game[aria-current="true"] { background: transparent; }                   /* 选中靠下面滑动的高亮块，字不加粗 */
  .game[aria-current="true"] .gname { opacity: 1; }
  /* 滑动的高亮块：侧栏里是灰/白色圆角块，卡池标签里是反色的药丸；位置和大小由脚本设置，换选项时平滑滑过去 */
  .pill { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none;
          transition: transform .42s cubic-bezier(.4, 0, .2, 1), width .42s cubic-bezier(.4, 0, .2, 1), height .42s cubic-bezier(.4, 0, .2, 1); }
  #games .pill { background: var(--pill); border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
  .tabs .pill { background: var(--ink); border-radius: 999px; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .side .spacer { flex: 1; }
  .main { padding: 20px clamp(16px, 2.6vw, 56px) 70px; min-width: 0; }   /* 不再限制最大宽度：窗口拉宽，内容跟着变宽 */
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0 auto 0 0; letter-spacing: .5px; line-height: 0; }
  h1 img { width: clamp(52px, 2.4vw + 28px, 76px); height: clamp(52px, 2.4vw + 28px, 76px); border-radius: 22%; display: block; box-shadow: 0 2px 8px rgba(0,0,0,.28); }

  #status { margin: 0 0 14px; padding: 10px 14px; border-radius: 10px; display: none; white-space: pre-line; }
  #status.show { display: block; }
  #status.info { background: var(--info-bg); } #status.ok { background: var(--ok-bg); }
  #status.warn { background: var(--warn-bg); } #status.error { background: var(--err-bg); }

  details.adv { margin-bottom: 14px; color: var(--muted); }
  details.adv summary { cursor: pointer; width: fit-content; }
  details.adv .fields { display: grid; gap: 10px; margin-top: 10px; }
  details.adv label { display: grid; gap: 4px; font-size: 13px; }
  details.adv input { width: 100%; }
  details.adv .pick { display: flex; gap: 8px; }
  #browse { white-space: nowrap; flex: none; }
  details.adv .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  pre.help { margin: 0; white-space: pre-wrap; font: inherit; font-size: 13px; }
  .guide { display: grid; gap: 8px; }
  .guide p { margin: 4px 0 0; font-size: 14px; line-height: 1.6; color: var(--ink); }
  .guide p.fine { font-size: 12px; color: var(--muted); }
  .urlrow { display: flex; align-items: center; gap: 10px; width: fit-content; max-width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 8px 14px; }
  .urlrow .where { flex: none; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }
  .urlrow code { min-width: 0; font: 600 16px/1.4 ui-monospace, Consolas, "Cascadia Mono", monospace; color: var(--ink); word-break: break-all; user-select: all; }
  .urlrow button { flex: none; display: grid; place-items: center; width: 36px; height: 36px; padding: 0; }
  .urlrow button svg { width: 18px; height: 18px; }
  .urlrow button.done { border-color: var(--good); color: var(--good); }
  .need-input { border-color: var(--warn); }
  #report { width: 100%; min-height: 150px; font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre; display: none; }
  #report.show { display: block; }

  .empty h2 { margin: 0 0 8px; font: 700 1.35em/1.4 var(--font-name); letter-spacing: .04em; }
  .empty ol { padding-left: 20px; margin: 10px 0; }
  .empty li { margin: 4px 0; }

  /* 卡池标签：最底下是一块底板（深色模式下是黑的），白色（浅色模式下是黑色）的滑块在底板上方滑动，文字在最上面 */
  .tabs { position: relative; display: flex; flex-wrap: wrap; gap: 4px; width: fit-content; max-width: 100%; margin: 4px 0 14px; padding: 4px;
          background: var(--card); border: 1px solid var(--line); border-radius: 26px; }
  .tab { position: relative; z-index: 1; background: transparent; border-color: transparent; border-radius: 999px; padding: 6px 14px; transition: color .3s, background-color .2s; }
  .tab:hover:not(:disabled) { border-color: transparent; }
  .tab[aria-selected="false"]:hover { background: rgba(128,128,128,.16); }
  .tab[aria-selected="true"] { color: var(--bg); }
  .tab small { opacity: .7; margin-left: 4px; font-family: var(--font-num); font-weight: 600; font-size: .95em; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { padding: 12px 14px; }
  .stat .v { font: 600 clamp(27px, 1.3vw + 14px, 36px)/1.2 var(--font-num); font-variant-numeric: lining-nums tabular-nums; letter-spacing: .01em; }
  .stat .k { color: var(--muted); font-size: 13px; letter-spacing: .06em; margin-top: 2px; }
  .pity { margin-bottom: 14px; }
  .pity .row { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .bar { position: relative; height: 10px; border-radius: 6px; background: var(--track); overflow: hidden; }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--good);
             transition: width 1.1s cubic-bezier(.22, 1, .36, 1) var(--delay, 0ms); }   /* 从左往右长出来；每一根条有自己的延迟，错开先后 */
  .bar > i.warn { background: var(--warn); } .bar > i.bad { background: var(--bad); }
  .pity .bar { overflow: visible; }
  .pity .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--muted); opacity: .6; }
  h2.sec { font: 700 1.2em/1.4 var(--font-name); letter-spacing: .06em; margin: 22px 0 10px; }
  .tops { display: grid; gap: 2px; }
  .tops .item { display: grid; grid-template-columns: minmax(110px, 1.2fr) 1fr 44px; align-items: center; gap: 4px 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .tops .item:last-child { border-bottom: 0; }
  .tops .name { font: 700 1.32em/1.35 var(--font-name); letter-spacing: .04em; }
  .tops .nm-line { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .nm-line .tag { margin-left: 0; line-height: 1.35; }
  .tops .time { color: var(--muted); font: 600 13px/1.5 var(--font-num); letter-spacing: .02em; display: block; }
  .tops .num { text-align: right; font: 600 1.45em/1.2 var(--font-num); font-variant-numeric: lining-nums tabular-nums; }
  .tops .num.good { color: var(--good); } .tops .num.warn { color: var(--warn); } .tops .num.bad { color: var(--bad); }
  .tag.lose { background: var(--err-bg); color: var(--bad); font: 500 13px/1.35 var(--font-ui); padding: 2px 10px; }
  .tag { font: 500 11px/1.4 var(--font-ui); padding: 1px 7px; border-radius: 999px; background: var(--track); color: var(--muted); margin-left: 6px; }
  .filters { display: flex; gap: 8px; margin-bottom: 8px; }
  .filters button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  tr.top td.nm { color: var(--top); font-weight: 500; } tr.top { background: var(--top-bg); }
  tr.second td.nm { color: var(--second); font-weight: 500; } tr.second { background: var(--second-bg); }
  tr.other td.nm { color: var(--other); }
  .pager { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .pager { gap: 12px; }
  .pager button { min-width: 60px; font-size: 27px; line-height: 1; padding: 12px 18px; }       /* 比之前大了 50%，按钮和里面的箭头都是 */
  .pager .where { min-width: 160px; text-align: center; font-variant-numeric: tabular-nums; font-size: 1.05em; }
  .pity b { font: 600 1.3em/1 var(--font-num); font-variant-numeric: lining-nums tabular-nums; margin: 0 .1em; }
  footer { margin-top: 28px; font-size: 12px; word-break: break-all; }
  footer a { color: var(--accent); }

  /* ---- 左下角：太阳 / 月亮，点一下切换浅色和深色 ---- */
  .theme-fab { position: fixed; left: 20px; bottom: 20px; width: 46px; height: 46px; padding: 0; border-radius: 50%; z-index: 20;
               display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(0,0,0,.22); }
  .theme-fab svg { grid-area: 1 / 1; width: 24px; height: 24px; transition: transform .5s cubic-bezier(.4,0,.2,1), opacity .35s; }
  .theme-fab .sun { color: #e8a317; }
  .theme-fab .moon { color: var(--accent); }
  :root[data-mode="light"] .theme-fab .moon, :root[data-mode="dark"] .theme-fab .sun { opacity: 0; transform: rotate(-90deg) scale(.4); }
  :root[data-mode="light"] .theme-fab .sun, :root[data-mode="dark"] .theme-fab .moon { opacity: 1; transform: none; }

  /* 切换外观时，新配色从左下角以一个圆形扩散开（动画本身在脚本里），这里只是去掉浏览器默认的淡入淡出 */
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  ::view-transition-old(root) { z-index: 1; } ::view-transition-new(root) { z-index: 2; }

  /* ---- 开屏：整页跟随当前外观的底色，中间是软件图标 ---- */
  #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--bg);
            transition: opacity .5s ease, background-color .25s; }
  #splash.leaving { opacity: 0; pointer-events: none; }
  #splash img { width: 128px; height: 128px; border-radius: 22%; box-shadow: 0 10px 40px rgba(0,0,0,.3);
                animation: splash-in .8s cubic-bezier(.2,.8,.2,1) both, splash-breathe 2.2s ease-in-out .8s infinite; }
  @keyframes splash-in { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
  @keyframes splash-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } .theme-fab svg { transition: none; } .bar > i { transition: none; } }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .side { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px; position: static; height: auto; }
    .brand, .side .spacer { display: none; }
    .game { width: auto; white-space: nowrap; min-height: 0; padding: 8px 12px; }
    .game small { display: none; }
  }
  @media (max-width: 520px) { .tops .item { grid-template-columns: 1fr 44px; } .tops .bar { grid-column: 1 / -1; order: 3; } }
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><img src="icons/app.png" alt=""></div>
<div class="app">
  <aside class="side">
    <div class="brand">抽卡查询</div>
    <nav id="games"><span class="pill" aria-hidden="true"></span></nav>
    <div class="spacer"></div>
  </aside>

  <div class="main">
    <header>
      <h1 id="title" aria-label="抽卡查询"><img id="title-logo" src="icons/app.png" alt=""></h1>
      <select id="uid" aria-label="选择账号" hidden></select>
      <button id="export-csv" hidden>导出 CSV</button>
      <button id="export-json" hidden>导出 JSON</button>
      <button id="sync" class="primary">更新记录</button>
    </header>

    <div id="status" role="status" aria-live="polite"></div>

    <details class="adv">
      <summary>高级</summary>
      <div class="fields">
        <label id="dir-field">当前游戏的安装目录（自动找不到时才需要）
          <span class="pick">
            <input id="game-dir" placeholder="例如 D:\Games\游戏安装目录" autocomplete="off">
            <button id="browse" type="button">浏览…</button>
          </span>
        </label>
        <label>
          <span id="manual-label">粘贴记录链接</span>
          <input id="manual-url" placeholder="https://…" autocomplete="off" spellcheck="false">
        </label>
        <div id="manual-guide" class="guide" hidden></div>
        <div class="tools">
          <button id="diagnose" type="button">环境检测</button>
          <button id="copy-report" type="button" hidden>复制检测结果</button>
        </div>
        <textarea id="report" readonly aria-label="环境检测结果"></textarea>
      </div>
    </details>

    <div id="tabs" class="tabs" role="tablist" hidden><span class="pill" aria-hidden="true"></span></div>
    <main id="content"></main>
    <footer id="footer" class="muted"></footer>
  </div>
</div>

<button id="theme" class="theme-fab" type="button" aria-label="切换深色或浅色" title="切换深色 / 浅色">
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4.2" fill="currentColor"/>
    <path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M5.3 18.7L7 17M17 7l1.7-1.7"/>
  </svg>
  <svg class="moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <path d="M20.2 14.6A8.4 8.4 0 0 1 9.4 3.8a.6.6 0 0 0-.8-.7 9.4 9.4 0 1 0 12.3 12.3.6.6 0 0 0-.7-.8z"/>
  </svg>
</button>

<script>
const $ = (sel) => document.querySelector(sel);

// 所有来自后台的文字都经 textContent 写入，不拼 HTML
function el(tag, props = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v === true) node.setAttribute(k, "");
    else if (v !== false && v != null) node.setAttribute(k, v);
  }
  for (const kid of kids.flat()) node.append(kid instanceof Node ? kid : document.createTextNode(kid));
  return node;
}

const state = { games: [], game: null, uid: null, data: null, pool: null, filter: "all", shown: 100,
               running: false, autoOpenedFor: null, theme: "auto", page: 0, themeStamp: 0, tabsGame: null };
const PAGE = 10;       // 「全部记录」每页 10 条
const ICON = (key) => `icons/${key}.png`;   // 各游戏的官方图标

// 后台方法由软件窗口注入：window.pywebview.api.<方法名>(...)，返回 Promise
const inApp = () => !!(window.pywebview && window.pywebview.api);
const call = (name, ...args) => window.pywebview.api[name](...args);
const currentGame = () => state.games.find((g) => g.key === state.game);

// ---------- 外观：右下角的太阳/月亮，一键在浅色和深色之间切换 ----------
// state.theme 有三种：auto（默认，跟随系统）、light、dark；点按钮后就是明确的浅色或深色，并记下来。
const THEMES = ["auto", "light", "dark"];
const systemDark = window.matchMedia("(prefers-color-scheme: dark)");
const effectiveTheme = () => (state.theme === "auto" ? (systemDark.matches ? "dark" : "light") : state.theme);

function applyTheme(theme) {
  state.theme = THEMES.includes(theme) ? theme : "auto";
  if (state.theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.dataset.theme = state.theme;
  document.documentElement.dataset.mode = effectiveTheme();      // 决定右下角显示太阳还是月亮
}
systemDark.addEventListener("change", () => applyTheme(state.theme));

// 切换时：新配色从左下角以一个圆形慢慢放大，盖住旧配色（浏览器不支持这个动画就直接切换）
const REVEAL_FROM = "0px 100%";
function switchTheme(next) {
  const stamp = ++state.themeStamp;
  const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!document.startViewTransition || calm) { applyTheme(next); return; }
  try {
    const radius = Math.hypot(window.innerWidth, window.innerHeight);
    const transition = document.startViewTransition(() => applyTheme(next));
    transition.ready.then(() => document.documentElement.animate(
      { clipPath: [`circle(0px at ${REVEAL_FROM})`, `circle(${radius}px at ${REVEAL_FROM})`] },
      { duration: 650, easing: "cubic-bezier(.4, 0, .2, 1)", pseudoElement: "::view-transition-new(root)" },
    )).catch(() => {});
  } catch { applyTheme(next); }
  // 万一动画没能跑起来、配色没换上：过一会儿补上（点得太快、又切换了一次的话就不补）
  setTimeout(() => { if (stamp === state.themeStamp && state.theme !== next) applyTheme(next); }, 1500);
}

// ---------- 滑动的高亮块（侧栏选中的游戏、卡池标签）----------
// 滑块是页面上一直存在的同一个元素（选项按钮每次会重新生成，滑块不会），
// 所以改它的位置时，CSS 过渡会让它从“当前所在的位置”平滑滑到“被点的那一项”。
function placePill(box, target, animate = true) {
  const pill = box && box.querySelector(":scope > .pill");
  if (!pill || !target) return;
  const apply = () => {
    pill.style.transform = `translate(${target.offsetLeft}px, ${target.offsetTop}px)`;
    pill.style.width = `${target.offsetWidth}px`;
    pill.style.height = `${target.offsetHeight}px`;
  };
  if (animate && pill.dataset.placed) { apply(); return; }
  pill.style.transition = "none";       // 第一次摆放，或者整套选项都换了：直接放到位，不滑动
  apply();
  pill.getBoundingClientRect();
  pill.style.transition = "";
  pill.dataset.placed = "1";
}
function placeGamesPill(animate = true) {
  const box = $("#games");
  placePill(box, box.querySelector('[aria-current="true"]'), animate);
}
function placeTabsPill(animate = true) {
  const box = $("#tabs");
  if (!box.hidden) placePill(box, box.querySelector('[aria-selected="true"]'), animate);
}
let resizeTimer = 0;
window.addEventListener("resize", () => {         // 窗口大小变了，高亮块要跟着对准（不要滑动效果）
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { placeGamesPill(false); placeTabsPill(false); }, 60);
});

// ---------- 开屏：整页跟随外观的底色，中间是软件图标；界面准备好后淡出 ----------
const splashShownAt = performance.now();
function hideSplash() {
  const splash = $("#splash");
  if (!splash || splash.dataset.leaving) return;
  splash.dataset.leaving = "1";
  // 等字体都加载好再淡出，免得进来的一瞬间字体“跳一下”；字体最多等 2.5 秒
  const fontsReady = Promise.race([document.fonts.ready, new Promise((done) => setTimeout(done, 2500))]);
  const wait = Math.max(0, 1200 - (performance.now() - splashShownAt));   // 至少让人看清 1.2 秒
  fontsReady.then(() => setTimeout(() => {
    splash.classList.add("leaving");
    setTimeout(() => { splash.remove(); startWaitingBars(); }, 600);       // 开屏完全淡出、露出界面之后，条才开始长
  }, wait));
}
setTimeout(hideSplash, 9000);   // 不管出什么状况，开屏最多停 9 秒，不会一直挡着

function onFatal(e) {
  hideSplash();
  setRunning(false);
  setStatus("error", `出错了：${(e && e.message) || e}`);
}

// 这个页面只能在软件的窗口里用；如果被人直接拿浏览器打开，就没有后台可以调用
function renderNotInApp() {
  hideSplash();
  $("#sync").disabled = true;
  $("#uid").hidden = $("#export-csv").hidden = $("#export-json").hidden = true;
  setStatus("error", "这个页面需要在「抽卡查询」软件的窗口里使用，不能直接用浏览器打开。");
  $("#content").replaceChildren(el("section", { class: "card empty" },
    el("h2", {}, "请打开软件"),
    el("p", {}, "请从开始菜单或桌面快捷方式启动「抽卡查询」，在它自己的窗口里使用。"),
  ));
}

function setStatus(kind, text) {
  const box = $("#status");
  box.className = text ? `show ${kind}` : "";
  box.textContent = text || "";
}

// ---------- 加载 ----------
async function init() {
  const [st, info] = await Promise.all([call("get_state"), call("app_info")]);
  renderFooter(info);
  applyTheme(st.theme);
  state.games = st.games;
  const remembered = safeGet("game");
  const firstWithData = state.games.find((g) => g.uids.length);
  state.game = (state.games.find((g) => g.key === remembered) || firstWithData || state.games[0]).key;
  if (st.sync.state === "running") { setRunning(true); poll(); }
  await selectGame(state.game);
  hideSplash();
}

function renderFooter(info) {
  $("#footer").replaceChildren(
    `数据保存在 ${info.data_dir}`, " · ",
    el("a", { href: "#", onclick: (e) => { e.preventDefault(); call("open_data_dir").catch(onFatal); } }, "打开文件夹"),
    ` · v${info.version}`);
}

function renderGames() {
  const nav = $("#games");
  nav.querySelectorAll(".game").forEach((b) => b.remove());
  nav.append(...state.games.map((g) => el("button", {
    class: "game", "data-key": g.key, "aria-current": g.key === state.game ? "true" : "false",
    onclick: () => selectGame(g.key).catch(onFatal),
  }, el("img", { src: ICON(g.key), alt: "" }), el("span", { class: "gname" }, g.short_name),
     el("small", {}, g.uids.length ? `${g.uids.length} 个账号` : "未导入"))));
  placeGamesPill();
}

async function selectGame(key, keepStatus = false) {
  // 提示条（“更新完成，新增 N 条记录”、报错等）说的是刚才那次操作，换了游戏就不该继续挂着。
  // 例外：更新刚做完要显示结果（keepStatus），以及更新还在跑时的进度（会被轮询持续刷新）。
  if (!keepStatus && !state.running) setStatus("", "");
  state.game = key;
  safeSet("game", key);
  state.pool = null; state.filter = "all"; state.data = null;
  const game = currentGame();
  const remembered = safeGet(`uid:${key}`);
  state.uid = game.uids.includes(remembered) ? remembered : game.uids[0] || null;
  $("#title-logo").src = ICON(game.key);       // 页面顶部不写游戏名，直接用它的官方图标
  $("#title-logo").alt = game.name;
  $("#title").setAttribute("aria-label", game.name);
  $("#title").title = game.name;
  $("#game-dir").value = "";
  applyManualField();
  renderGames();
  fillUids();
  if (state.uid) await loadWishes(); else renderEmpty();
}

// 「高级」里的手动输入框：多数游戏是“粘贴记录链接”（可选），明日方舟是“粘贴账号令牌”（必填，按密码显示）
function applyManualField() {
  const g = currentGame();
  const input = $("#manual-url");
  input.value = "";
  input.type = g.manual_secret ? "password" : "text";
  input.placeholder = g.manual_secret ? "粘贴官网页面上显示的整段文字" : "https://…";
  input.classList.toggle("need-input", !!g.manual_required);
  $("#dir-field").hidden = !!g.manual_required;       // 没有本地文件可读的游戏，不需要选安装目录
  $("#manual-label").textContent = g.manual_label || "粘贴记录链接";
  renderGuide(g.manual_guide && g.manual_guide.length ? g.manual_guide
    : (g.manual_help ? g.manual_help.split("\n").map((line) => ({ kind: "text", text: line })) : []));
  // 明日方舟必须手动粘贴令牌，切到它时自动展开「高级」；离开它时再收起，别一直开着占地方。
  // 只收起“程序自己展开的”，用户自己展开或收起的，不去打扰。
  if (g.manual_required) openAdvancedFor(g);
  else if (state.autoOpenedFor && state.autoOpenedFor !== g.key) {
    $("details.adv").open = false;
    state.autoOpenedFor = null;
  }
}

// 说明文字和网址：网址单独一行、字号大、紧跟着一个「复制」图标按钮，点一下就能复制
const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.2"/><path d="M5 15V6.2A2.2 2.2 0 0 1 7.2 4H16"/></svg>';
const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function renderGuide(items) {
  const box = $("#manual-guide");
  box.hidden = !items.length;
  box.replaceChildren(...items.map((item) => {
    if (item.kind === "url") {
      const button = el("button", { type: "button", title: "复制", "aria-label": `复制 ${item.url}` });
      button.innerHTML = COPY_ICON;               // 固定的图标，不是来自后台的内容
      button.addEventListener("click", () => copyText(item.url, button));
      return el("div", { class: "urlrow" },
        item.label ? el("span", { class: "where" }, item.label) : "", el("code", {}, item.url), button);
    }
    return el("p", { class: item.kind === "fine" ? "fine" : "" }, item.text);
  }));
}

async function copyText(text, button) {
  try { await navigator.clipboard.writeText(text); }
  catch {   // 剪贴板接口不可用时的备用办法
    const box = el("textarea", { style: "position:fixed;opacity:0" });
    box.value = text;
    document.body.append(box);
    box.select();
    document.execCommand("copy");
    box.remove();
  }
  button.innerHTML = CHECK_ICON;                  // 复制成功：图标变成一个对勾，一会儿再变回来
  button.classList.add("done");
  button.title = "已复制";
  setTimeout(() => { button.innerHTML = COPY_ICON; button.classList.remove("done"); button.title = "复制"; }, 1600);
}

function openAdvancedFor(game) {
  $("details.adv").open = true;
  state.autoOpenedFor = game.key;
}

function fillUids() {
  const game = currentGame();
  const select = $("#uid");
  select.replaceChildren(...game.uids.map((u) => el("option", { value: u }, `UID ${u}`)));
  if (state.uid) select.value = state.uid;
  select.hidden = game.uids.length < 2;
  $("#export-csv").hidden = $("#export-json").hidden = !state.uid;
}

async function loadWishes() {
  const data = await call("get_wishes", state.game, state.uid);
  if (data.error) { setStatus("error", data.error); return; }
  state.data = data;
  state.page = 0;
  const visible = data.pools.filter((p) => p.total > 0);
  if (!visible.some((p) => p.key === state.pool)) state.pool = (visible[0] || data.pools[0]).key;
  render();
}

// ---------- 更新 ----------
function setRunning(running) {
  state.running = running;
  $("#sync").disabled = running;
  $("#sync").textContent = running ? "更新中…" : "更新记录";
}

async function startSync(game) {
  setRunning(true);
  setStatus("info", "正在开始…");
  try {
    const single = game !== "all";
    const secret = single ? $("#manual-url").value : "";
    $("#manual-url").value = "";       // 交给后台之后立刻清掉，令牌不在界面上多停留
    await call("start_sync", game, secret, single ? $("#game-dir").value : "");
    poll();   // 已经有更新在跑时也一样：接着显示它的进度
  } catch (e) { onFatal(e); }
}

async function poll() {
  try {
    const job = await call("sync_status");
    if (job.state === "running") {
      setStatus("info", job.message);
      setTimeout(poll, 600);
      return;
    }
    setRunning(false);
    if (job.state === "error") {
      setStatus("error", job.message);
      // 更新失败时，如果这个游戏有“手动粘贴凭证”的办法（终末地读日志失败后用账号令牌），直接把它展开给用户看
      const g = currentGame();
      if (g && g.manual_help && job.game === g.key) openAdvancedFor(g);
      return;
    }
    setStatus(job.warn ? "warn" : "ok", job.message);
    const st = await call("get_state");
    state.games = st.games;
    if (job.uid && job.game === state.game) {
      state.uid = job.uid;
      safeSet(`uid:${state.game}`, job.uid);
    }
    if (job.game && job.game !== state.game && job.results.length === 1) state.game = job.game;
    if (!currentGame().uids.length) {   // “更新全部”之后，当前游戏没数据就换到有数据的第一个
      const other = state.games.find((g) => g.uids.length);
      if (other) state.game = other.key;
    }
    await selectGame(state.game, true);
  } catch (e) { onFatal(e); }
}

// ---------- 需要系统对话框的操作 ----------
async function doExport(fmt) {
  try {
    const r = await call("export_records", state.game, state.uid, fmt);
    if (r.error) setStatus("error", r.error);
    else if (r.ok) setStatus("ok", `已导出到：${r.path}`);
  } catch (e) { onFatal(e); }
}

async function browseGameDir() {
  try {
    const r = await call("pick_game_dir");
    if (r.path) $("#game-dir").value = r.path;
  } catch (e) { onFatal(e); }
}

async function runDiagnose() {
  try {
    $("#diagnose").disabled = true;
    const { report } = await call("diagnose");
    const box = $("#report");
    box.value = report;
    box.className = "show";
    $("#copy-report").hidden = false;
  } catch (e) { onFatal(e); } finally { $("#diagnose").disabled = false; }
}

async function copyReport() {
  const box = $("#report");
  try { await navigator.clipboard.writeText(box.value); }
  catch { box.select(); document.execCommand("copy"); }   // 剪贴板接口不可用时的备用办法
  setStatus("ok", "检测结果已复制，可以直接粘贴发给开发者。");
}

// ---------- 渲染 ----------
function renderEmpty() {
  $("#tabs").hidden = true;
  state.tabsGame = null;
  const game = currentGame();
  const steps = game.manual_required
    ? [el("li", {}, "展开上面的「高级」，照说明拿到账号令牌，粘贴到框里。"),
       el("li", {}, "点右上角的「更新记录」。")]
    : [el("li", {}, `打开${game.short_name}，${game.hint}`),
       el("li", {}, "回到这里，点右上角的「更新记录」。")];
  $("#content").replaceChildren(el("section", { class: "card empty" },
    el("h2", {}, `还没有「${game.name}」的记录`),
    el("p", {}, "第一次使用，照下面做一遍："),
    el("ol", {}, ...steps, el("li", {}, "几秒到几十秒后，记录就会出现在这里，并保存在本机，下次可以继续累加。")),
    el("p", { class: "muted" }, `官方只保留${game.retention}的记录，所以建议隔一阵更新一次，这样更早的记录也会被攒下来。`),
  ));
}

function render() {
  const pool = state.data.pools.find((p) => p.key === state.pool);
  renderTabs();
  $("#content").replaceChildren(pool.total ? renderPool(pool) : el("p", { class: "muted" }, "这个卡池还没有记录。"));
  placeTabsPill(state.tabsGame === state.game);      // 同一个游戏里换卡池：滑过去；换了游戏：直接放到位
  state.tabsGame = state.game;
}

function renderTabs() {
  const box = $("#tabs");
  const visible = state.data.pools.filter((p) => p.total > 0);
  const pools = visible.length ? visible : state.data.pools;
  box.querySelectorAll(".tab").forEach((b) => b.remove());
  box.append(...pools.map((p) =>
    el("button", {
      class: "tab", role: "tab", "aria-selected": p.key === state.pool ? "true" : "false",
      onclick: () => { state.pool = p.key; state.filter = "all"; state.page = 0; render(); },
    }, p.name, el("small", {}, String(p.total)))));
  box.hidden = false;
}

function pityLevel(pool, pity) {
  if (!pool.soft_pity) return "good";
  if (pity >= pool.soft_pity) return "bad";
  return pity > Math.round(pool.soft_pity * 0.75) ? "warn" : "good";
}

function stat(label, value, tip = "") {
  return el("div", { class: "card stat", title: tip }, el("div", { class: "v" }, String(value)), el("div", { class: "k" }, label));
}

function renderPool(pool) {
  const g = state.data.game;
  const cards = [
    stat("总抽数", pool.total),
    stat(g.top_name, pool.top_count),
    stat(g.second_name, pool.second_count),
    stat(`${g.top_name}平均抽数`, pool.avg_pity_top ?? "-"),
  ];
  if (g.has_cost && pool.cost != null) cards.push(stat(`约消耗${g.currency}`, pool.cost.toLocaleString()));
  if (pool.free_count) cards.push(stat("免费抽（不计保底）", pool.free_count));
  if (pool.lose_rate != null) {
    cards.push(stat("歪常驻角色概率", `${pool.lose_rate}%`,
      `没有大保底的${g.top_name}里，出了常驻角色的比例：${pool.lose_count} / ${pool.lose_eligible}（歪了之后的下一个是大保底，不算）`));
  }
  if (pool.ten_pulls) {
    cards.push(stat("十连双金", pool.ten_top2,
      `共 ${pool.ten_pulls} 次十连，其中 ${pool.ten_top2} 次一次出了 2 个及以上${g.top_name}（3 个、4 个也算）`));
  }

  const parts = [el("div", { class: "stats" }, cards)];
  if (pool.hard_pity) parts.push(renderPity(pool));
  parts.push(renderTops(pool), renderTable(pool));
  if (state.data.updated_at) {
    parts.push(el("p", { class: "muted" }, `本地记录最近一次新增：${state.data.updated_at.replace("T", " ")}`));
  }
  return el("div", {}, parts);
}

// 保底的条：先是空的，等它进入眼前（窗口可见范围）时才从左往右长到该有的长度。
// 每一根条各自被观察、各自开始，所以翻页、换卡池、往下滚动时，看到哪几根，哪几根就各自动起来。
const barWatcher = "IntersectionObserver" in window
  ? new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        const fill = entry.target.firstElementChild;
        fill.style.width = fill.dataset.width;
        barWatcher.unobserve(entry.target);
      }
    }, { threshold: 0.3 })
  : null;

const barsWaitingForSplash = [];      // 开屏还盖在上面的时候，条先不长（不然在开屏后面长完了，看不到）
function startWaitingBars() {
  while (barsWaitingForSplash.length) barWatcher && barWatcher.observe(barsWaitingForSplash.pop());
}

function bar(percent, level, order = 0, extra = {}, ...inside) {
  const width = `${Math.max(0, Math.min(100, percent))}%`;
  const fill = el("i", {
    class: level === "good" ? "" : level, "data-width": width,
    style: `width:${barWatcher ? "0" : width}; --delay:${Math.min(order, 7) * 110}ms`,   // 同时出现的几根条，依次晚 0.11 秒；最多错开 8 根
  });
  const box = el("div", { class: "bar", ...extra }, fill, ...inside);
  if (barWatcher) {
    if ($("#splash")) barsWaitingForSplash.push(box);
    else barWatcher.observe(box);
  }
  return box;
}

function renderPity(pool) {
  const g = state.data.game;
  const cur = pool.current_pity_top;
  const level = pityLevel(pool, cur);
  const left = pool.hard_pity - cur;
  const tick = pool.soft_pity
    ? el("span", { class: "tick", title: `约 ${pool.soft_pity} 抽起概率大幅提升`, style: `left:${(pool.soft_pity / pool.hard_pity) * 100}%` })
    : "";
  return el("section", { class: "card pity" },
    el("div", { class: "row" },
      el("span", {}, "已垫 ", el("b", {}, String(cur)), " 抽"),
      el("span", { class: "muted" }, `距硬保底还有 ${left} 抽 · ${g.second_name}已垫 ${pool.current_pity_second} 抽`)),
    bar((cur / pool.hard_pity) * 100, level, 0, { role: "img", "aria-label": `已垫 ${cur} / ${pool.hard_pity}` }, tick),
  );
}

function renderTops(pool) {
  const g = state.data.game;
  const tops = pool.records.filter((r) => r.tier === "top");
  if (!tops.length) return el("p", { class: "muted" }, `这个卡池还没出过${g.top_name}。`);
  const cap = pool.hard_pity || Math.max(...tops.map((r) => r.pity));
  return el("section", {},
    el("h2", { class: "sec" }, `${g.top_name}记录（从新到旧）`),
    el("div", { class: "card tops" }, tops.map((r, order) => {
      const level = pityLevel(pool, r.pity);
      return el("div", { class: "item" },
        el("span", { class: "name" },
          el("span", { class: "nm-line" }, r.name,
            r.free ? el("span", { class: "tag", title: "免费抽（如加急招募）不计入保底" }, "免费") : "",
            r.standard ? el("span", { class: "tag lose", title: "活动池里出了常驻角色，多半是歪了；但这些角色自己 UP 的复刻池里出了不算歪，这里无法区分" }, "歪") : ""),
          el("span", { class: "time" }, r.time)),
        bar((r.pity / cap) * 100, level, order + 1),          // 第一根留给上面的总条，这些从第二个开始依次长出来
        el("span", { class: `num ${level}` }, String(r.pity)));
    })));
}

function renderTable(pool) {
  const g = state.data.game;
  const keep = { all: () => true, second: (r) => r.tier !== "other", top: (r) => r.tier === "top" }[state.filter];
  const rows = pool.records.filter(keep);
  const pages = Math.max(1, Math.ceil(rows.length / PAGE));
  state.page = Math.min(Math.max(0, state.page), pages - 1);
  const shown = rows.slice(state.page * PAGE, (state.page + 1) * PAGE);
  const filterBtn = (key, label) => el("button", {
    "aria-pressed": state.filter === key ? "true" : "false",
    onclick: () => { state.filter = key; state.page = 0; render(); },
  }, label);
  return el("section", {},
    el("h2", { class: "sec" }, "全部记录"),
    el("div", { class: "filters" }, filterBtn("all", "全部"), filterBtn("second", `${g.second_name}及以上`), filterBtn("top", `只看${g.top_name}`)),
    el("div", { class: "card tablewrap" }, el("table", {},
      el("thead", {}, el("tr", {}, ["#", "时间", "名称", "类别", "品级", "垫抽"].map((h) => el("th", {}, h)))),
      el("tbody", {}, shown.map((r) => el("tr", { class: r.tier },
        el("td", {}, String(r.n)), el("td", {}, r.time), el("td", { class: "nm" }, r.name),
        el("td", {}, r.item_type), el("td", {}, r.mark), el("td", {}, r.pity ?? "")))))),
    pages > 1 ? renderPager(pages, rows.length) : "");
}

function renderPager(pages, total) {
  const go = (page) => () => {
    state.page = page;
    render();
    document.querySelector(".filters")?.scrollIntoView({ block: "start" });   // 翻页后回到表格上方，从第一行开始看
  };
  const arrow = (label, text, target, disabled) =>
    el("button", { type: "button", "aria-label": label, title: label, disabled, onclick: go(target) }, text);
  return el("div", { class: "pager" },
    arrow("第一页", "«", 0, state.page === 0),
    arrow("上一页", "‹", state.page - 1, state.page === 0),
    el("span", { class: "where muted" }, `第 ${state.page + 1} / ${pages} 页 · 共 ${total} 条`),
    arrow("下一页", "›", state.page + 1, state.page >= pages - 1),
    arrow("最后一页", "»", pages - 1, state.page >= pages - 1));
}

// ---------- 其他 ----------
function safeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch { /* 隐私模式下可能不可用，忽略 */ } }

$("#sync").addEventListener("click", () => startSync(state.game));
$("#theme").addEventListener("click", () => {
  const next = effectiveTheme() === "dark" ? "light" : "dark";
  switchTheme(next);                                         // 先切换，立刻看到效果
  if (inApp()) call("set_theme", next).catch(onFatal);       // 再记下来，下次打开还是这个
});
$("#uid").addEventListener("change", (e) => {
  state.uid = e.target.value; safeSet(`uid:${state.game}`, state.uid); state.pool = null;
  loadWishes().catch(onFatal);
});
$("#export-csv").addEventListener("click", () => doExport("csv"));
$("#export-json").addEventListener("click", () => doExport("json"));
$("#browse").addEventListener("click", browseGameDir);
$("#diagnose").addEventListener("click", runDiagnose);
$("#copy-report").addEventListener("click", copyReport);

// 后台接口是窗口加载完页面之后才注入的，要等 pywebviewready 事件
const boot = () => init().catch(onFatal);
if (inApp()) boot();
else {
  window.addEventListener("pywebviewready", boot, { once: true });
  setTimeout(() => { if (!inApp()) renderNotInApp(); }, 5000);
}
</script>
</body>
</html>
